services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: handwriting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d handwriting"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/handwriting
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ""
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  capture-app:
    build:
      context: ./capture-app
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
